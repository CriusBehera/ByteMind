<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ByteMind Sessions</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(270deg, #0f0c29, #302b63, #24243e);
      background-size: 600% 600%;
      animation: gradientShift 15s ease infinite;
      color: #fff;
      padding: 40px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes blinkBorder {
      0%, 100% {
        box-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
        border: 2px solid #00ff00;
      }
      50% {
        box-shadow: 0 0 5px #00ff00;
        border: 2px solid #00ff00;
      }
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      color: #00f7ff;
      text-shadow: 0 0 10px #00f7ff;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin: 30px 0;
    }

    .controls input[type="text"],
    .controls button,
    .controls a {
      padding: 10px 20px;
      font-size: 1em;
      border-radius: 8px;
      border: none;
      width: 250px;
      text-align: center;
    }

    .controls input[type="text"] {
      border: none;
    }

    .controls button {
      background-color: #00f7ff;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px #00f7ff;
    }

    .controls a {
      background-color: #ff00c8;
      color: #0f172a;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 10px #ff00c8;
      transition: transform 0.2s ease;
    }

    .controls a:hover {
      transform: scale(1.05);
    }

    .session-list {
      max-width: 900px;
      margin: auto;
    }

    .session-card {
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .session-card.upcoming {
      border: 2px solid #00ff00;
      box-shadow: 0 0 10px #00ff00;
      animation: blinkBorder 1.5s infinite;
    }

    .session-card.past {
      border: 2px solid #00bfff;
      box-shadow: 0 0 10px #00bfff;
    }

    .session-card img {
      width: 160px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 0 10px #00f7ff;
    }

    .session-info {
      flex: 1;
    }

    .session-info h3 {
      color: #00ffae;
      margin-bottom: 10px;
    }

    .session-info p {
      color: #e0e0e0;
      margin: 5px 0;
    }

    .session-info a {
      color: #00f7ff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1>📅 ByteMind Sessions</h1>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search session name...">
    <button onclick="toggleSort()">Sort: <span id="sortLabel">Newest → Oldest</span></button>
    <a href="/index.html">🔙 Return to Home Page</a>
  </div>

  <div class="session-list" id="sessionList"></div>

  <script>
    const SHEETDB_URL = "https://sheetdb.io/api/v1/6h1akiks5y45b"; // Replace with your actual SheetDB endpoint
    let sessions = [];
    let sortNewestFirst = true;

    async function fetchSessions() {
      try {
        const res = await fetch(SHEETDB_URL);
        const data = await res.json();
        sessions = data.map(row => ({
          title: row.Title,
          date: row.Date,
          description: row.Description,
          link: row.Link,
          thumbnail: row.Thumbnail,
          upcoming: row.Upcoming === "Yes"
        }));
        renderSessions();
      } catch (err) {
        document.getElementById("sessionList").innerHTML = "<p style='text-align:center;'>⚠️ Failed to load sessions.</p>";
      }
    }

    function renderSessions() {
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      const list = document.getElementById("sessionList");
      list.innerHTML = "";

      const sorted = [...sessions].sort((a, b) => {
        return sortNewestFirst
          ? new Date(b.date) - new Date(a.date)
          : new Date(a.date) - new Date(b.date);
      });

      const filtered = sorted.filter(s => s.title.toLowerCase().includes(searchTerm));

      filtered.forEach(session => {
        const card = document.createElement("div");
        card.className = `session-card ${session.upcoming ? "upcoming" : "past"}`;
        card.innerHTML = `
          <img src="${session.thumbnail}" alt="${session.title}">
          <div class="session-info">
            <h3>${session.title}</h3>
            <p><strong>Date:</strong> ${session.date}</p>
            <p><strong>Description:</strong> ${session.description}</p>
            ${!session.upcoming ? `<a href="${session.link}" target="_blank">📂 View PPT</a>` : ""}
          </div>
        `;
        list.appendChild(card);
      });
    }

    function toggleSort() {
      sortNewestFirst = !sortNewestFirst;
      document.getElementById("sortLabel").textContent = sortNewestFirst ? "Newest → Oldest" : "Oldest → Newest";
      renderSessions();
    }

    document.getElementById("searchInput").addEventListener("input", renderSessions);

    fetchSessions();
  </script>

</body>
</html>
